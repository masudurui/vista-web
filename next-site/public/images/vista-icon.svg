<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vista icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A8533"/>
      <stop offset="1" stop-color="#067227"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F7FAF2"/>
      <stop offset="0.55" stop-color="#EDF4E9"/>
      <stop offset="1" stop-color="#D9E5D8"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F7EC"/>
      <stop offset="1" stop-color="#D6E2D5"/>
    </linearGradient>
  </defs>

  <!-- Rounded green tile -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="#000000" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Magnifier handle (drawn first so the ring overlaps it) -->
  <path d="M338 334 L398 394" fill="none" stroke="url(#grip)" stroke-width="56" stroke-linecap="round"/>

  <!-- Magnifier lens ring -->
  <circle cx="240" cy="236" r="136" fill="none" stroke="url(#glass)" stroke-width="56"/>

  <!-- Two "phone" dots inside the lens -->
  <rect x="190" y="195" width="34" height="82" rx="17" fill="url(#glass)"/>
  <rect x="256" y="195" width="34" height="82" rx="17" fill="url(#glass)"/>
</svg>
