<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks for buying Vista Pro — Vista</title>
<meta name="description" content="Thanks for buying Vista Pro. Check your email for your license key.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/svg+xml" href="/images/vista-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --stage: #F5F8F6;
    --surface: #FFFFFF;
    --ink: #05261C;
    --muted: #42554C;
    --line: #E4EBE7;
    --accent: #13803B;
    --accent-hover: #0F6A31;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }
  .icon {
    display: block;
    width: 72px;
    height: 72px;
    margin: 0 auto 26px;
    border-radius: 23%;
    box-shadow: 0 12px 32px -18px rgba(20, 32, 24, .45);
  }
  .eyebrow {
    margin: 0 0 12px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(25px, 6vw, 33px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -.03em;
    text-wrap: balance;
  }
  .lede {
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 16px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .back:hover { background: var(--stage); border-color: #D6E1DB; }
  .back:active { transform: scale(.98); }
  .back svg { flex: none; }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0A1511;
      --stage: #12211B;
      --surface: #12211B;
      --ink: #EAF2ED;
      --muted: #9DB0A6;
      --line: #24382F;
      --accent: #4CCB7F;
      --accent-hover: #3FB86F;
    }
    .back:hover { border-color: #2F4A3E; }
  }
</style>
</head>
<body>
<main>
  <img class="icon" src="/images/vista-icon.svg" alt="" width="72" height="72" aria-hidden="true">
  <p class="eyebrow">Purchase complete</p>
  <h1>Thanks for buying Vista Pro.</h1>
  <p class="lede">Check your email for your license key.</p>
  <a class="back" href="/">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Back to Vista
  </a>
</main>
</body>
</html>
